apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: dispatch-core
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatch-core
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatch-core
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: dispatch-core
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: {{ .Values.app.logLevel | quote }}
            - name: BATCH_WINDOW_SECONDS
              value: {{ .Values.app.batchWindowSeconds | quote }}
        {{- if .Values.metricsRelay.enabled }}
        - name: metrics-relay
          image: "{{ .Values.metricsRelay.image.repository }}:{{ .Values.metricsRelay.image.tag }}"
          imagePullPolicy: {{ .Values.metricsRelay.image.pullPolicy }}
          command: ["sh", "-c", "while true; do sleep 30; done"]
        {{- end }}
